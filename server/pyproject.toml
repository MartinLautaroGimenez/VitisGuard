[project]
name = "vitisguard-server"
version = "0.1.0"
description = "Recepción de fotos, conteo de Lobesia botrana y grados-día"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Detector YOLO. Ultralytics es AGPL-3.0: ver docs/modelo.md.
yolo = ["ultralytics>=8.3"]

[project.scripts]
vitisguard-admin = "vitisguard_server.cli:main"

[tool.setuptools]
packages = ["vitisguard_server"]

[tool.setuptools.package-data]
vitisguard_server = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
