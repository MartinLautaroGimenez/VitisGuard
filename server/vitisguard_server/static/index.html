<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VitisGuard</title>
<style>
  :root { --bg:#f7f5f0; --card:#fff; --ink:#222; --muted:#6b6b6b; --wine:#7b1e3a; --alert:#c0392b; --ok:#2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161414; --card:#221f1f; --ink:#eee; --muted:#a0a0a0; } }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--wine); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:1.3rem; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px;
         grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); }
  .card { background:var(--card); border-radius:10px; padding:14px; box-shadow:0 1px 3px #0002; }
  .card h2 { margin:0 0 4px; font-size:1.05rem; }
  .muted { color:var(--muted); font-size:.85rem; }
  .stats { display:flex; gap:16px; margin:10px 0; }
  .stat b { display:block; font-size:1.4rem; }
  .alert { color:var(--alert); font-weight:600; }
  .ok { color:var(--ok); }
  img { width:100%; border-radius:6px; margin-top:8px; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:60px; margin-top:8px; }
  .bars div { flex:1; background:var(--wine); min-height:1px; border-radius:2px 2px 0 0; }
</style>
</head>
<body>
<header><h1>VitisGuard · Lobesia botrana</h1></header>
<main id="traps"><p class="muted">Cargando…</p></main>
<script>
const fmt = s => s ? new Date(s).toLocaleString("es-AR", {timeZone: "America/Argentina/Mendoza"}) : "—";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load() {
  const traps = await (await fetch("/api/v1/traps")).json();
  const root = document.getElementById("traps");
  if (!traps.length) { root.innerHTML = '<p class="muted">No hay trampas registradas.</p>'; return; }
  root.innerHTML = "";
  for (const t of traps) {
    const id = encodeURIComponent(t.id);
    const [s, caps] = await Promise.all([
      fetch(`/api/v1/traps/${id}/summary`).then(r => r.json()),
      fetch(`/api/v1/traps/${id}/captures?limit=1`).then(r => r.json()),
    ]);
    const weeks = s.weekly_captures.slice(-10);
    const max = Math.max(1, ...weeks.map(w => w.count));
    const el = document.createElement("section");
    el.className = "card";
    el.innerHTML = `
      <h2>${esc(t.name)}</h2>
      <div class="muted">${esc(t.id)} · última foto ${fmt(t.last_capture_at)} · señal ${t.signal_csq ?? "—"}</div>
      <div class="stats">
        <div class="stat"><b class="${s.alert ? "alert" : "ok"}">${s.this_week}</b><span class="muted">esta semana</span></div>
        <div class="stat"><b>${t.last_count_total ?? "—"}</b><span class="muted">en el piso</span></div>
        <div class="stat"><b>${s.degree_days}</b><span class="muted">GD desde ${s.season_start}</span></div>
        <div class="stat"><b>${s.expected_flight ?? "—"}</b><span class="muted">vuelo est.</span></div>
      </div>
      ${s.alert ? `<div class="alert">Supera ${s.alert_threshold} polillas/semana</div>` : ""}
      <div class="bars" title="Capturas nuevas por semana">
        ${weeks.map(w => `<div style="height:${100 * w.count / max}%" title="${w.week}: ${w.count}"></div>`).join("")}
      </div>
      ${caps[0] ? `<a href="${caps[0].image_url}"><img src="${caps[0].annotated_url}" alt="Última foto con detecciones"></a>` : ""}`;
    root.appendChild(el);
  }
}
load();
</script>
</body>
</html>
