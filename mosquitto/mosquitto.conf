# VitisGuard — configuración de Mosquitto con TLS.
# Correr desde la raíz del proyecto:
#   mosquitto -c mosquitto/mosquitto.conf -v
# (antes generar los certificados con: bash mosquitto/gen_certs.sh)

# Listener TLS para los nodos y para el suscriptor de Flask
listener 8883 0.0.0.0
cafile   certs/ca.crt
certfile certs/server.crt
keyfile  certs/server.key
tls_version tlsv1.2

# En desarrollo aceptamos clientes anónimos sobre el canal ya cifrado.
# En producción: usar require_certificate true (mTLS) o password_file.
require_certificate false
allow_anonymous true

# Listener plano opcional SOLO para pruebas locales (dejar comentado en campo):
# listener 1883 127.0.0.1
# allow_anonymous true

persistence false
log_dest stdout
log_type notice
