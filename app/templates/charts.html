{% extends "base.html" %}
{% block title %}Gráficos{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
  <h4 class="mb-0">Series temporales</h4>
  <div class="d-flex gap-2">
    <select id="node-select" class="form-select form-select-sm" style="width:auto">
      <option value="">Todos los nodos</option>
      {% for n in nodes %}<option value="{{ n.node_id }}">{{ n.node_id }} — {{ n.name }}</option>{% endfor %}
    </select>
    <select id="days-select" class="form-select form-select-sm" style="width:auto">
      <option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option>
    </select>
  </div>
</div>

<div class="card p-3 mb-3">
  <div class="section-title">Capturas de <em>Lobesia botrana</em> por día</div>
  <div class="chart-box"><canvas id="capChart"></canvas></div>
</div>

<div class="card p-3" id="env-card">
  <div class="section-title">Temperatura y humedad <small class="text-secondary">(elegí un nodo)</small></div>
  <div class="chart-box"><canvas id="envChart"></canvas></div>
</div>
{% endblock %}

{% block scripts %}
<script>
Chart.defaults.color = "#9c94ad";
Chart.defaults.borderColor = "rgba(255,255,255,.06)";
let capChart, envChart;

async function refresh() {
  const node = document.getElementById("node-select").value;
  const days = document.getElementById("days-select").value;

  const cap = await VG.api(`/api/series/captures-per-day?days=${days}${node ? "&node=" + node : ""}`);
  capChart && capChart.destroy();
  capChart = new Chart(document.getElementById("capChart"), {
    type: "bar",
    data: { labels: cap.map((r) => r.day), datasets: [{ label: "Capturas", data: cap.map((r) => r.count), backgroundColor: "#6f2dbd" }] },
    options: { maintainAspectRatio: false, scales: { x: { ticks: { maxTicksLimit: 10 } } } },
  });

  envChart && envChart.destroy();
  if (node) {
    const rows = await VG.api(`/api/nodes/${node}/readings?days=${days}`);
    envChart = new Chart(document.getElementById("envChart"), {
      type: "line",
      data: { labels: rows.map((r) => VG.fmtDate(r.timestamp)),
        datasets: [
          { label: "Temp (°C)", data: rows.map((r) => r.temperature), borderColor: "#3d9be0", backgroundColor: "rgba(61,155,224,.12)", tension: .3, fill: true, yAxisID: "y" },
          { label: "Humedad (%)", data: rows.map((r) => r.humidity), borderColor: "#4c9a2a", tension: .3, yAxisID: "y1" },
        ] },
      options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
        scales: { x: { ticks: { maxTicksLimit: 8 } }, y: { position: "left" }, y1: { position: "right", grid: { drawOnChartArea: false } } } },
    });
    document.getElementById("env-card").style.display = "";
  } else {
    document.getElementById("env-card").style.display = "none";
  }
}

document.getElementById("node-select").addEventListener("change", refresh);
document.getElementById("days-select").addEventListener("change", refresh);
refresh();
</script>
{% endblock %}
